name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Codename (e.g., lmi, umi)'
        required: true
        default: 'lmi'
        type: choice
        options:
          - psyche
          - thyme
          - umi
          - munch
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa

      script:
        description: 'Select Build Script'
        required: true
        default: 'build.sh'
        type: choice
        options:
          - build.sh
          - build-miui.sh

      ksu:
        description: 'Enable KernelSU (ReSukiSU-SuSFS)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Kernel for ${{ inputs.device }} (${{ inputs.script }}) (${{ inputs.ksu && 'KSU' || 'NoKSU' }})
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3
        sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Cache (ccache)
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache_mikernel
        key: kernel-ccache-${{ inputs.device }}-${{ inputs.script }}-${{ github.run_id }}
        restore-keys: |
          kernel-ccache-${{ inputs.device }}-${{ inputs.script }}-
          kernel-ccache-${{ inputs.device }}-
          kernel-ccache-

    - name: Setup Toolchain (ZyC-Clang 15)
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260208-release/Clang-15.0.7-20260208.tar.gz
        tar -zxvf Clang-15.0.7-20260208.tar.gz

    - name: Build Kernel
      run: |
        chmod +x build.sh build-miui.sh
        
        echo "Using script: ${{ inputs.script }}"

        if [ "${{ inputs.ksu }}" == "true" ]; then
          echo "Building with KernelSU..."
          bash ${{ inputs.script }} ${{ inputs.device }} ksu
        else
          echo "Building without KernelSU..."
          bash ${{ inputs.script }} ${{ inputs.device }}
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Kernel-${{ inputs.device }}-${{ inputs.script }}-${{ inputs.ksu && 'KSU' || 'NoKSU' }}-${{ github.run_number }}
        path: ./*.zip
        if-no-files-found: error
release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get Short SHA
        id: vars
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$(date +'%Y%m%d')-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "SHA_SHORT=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_kernels
          pattern: Kernel-artifacts-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "APTKernel Build - ${{ steps.vars.outputs.BUILD_DATE }} (${{ steps.vars.outputs.SHA_SHORT }})"
          body: |
            ## 自动构建内核发布 / Automated Kernel Release
            
            - **构建日期 / Build Date:** ${{ steps.vars.outputs.BUILD_DATE }}
            - **提交哈希 / Commit SHA:** `${{ steps.vars.outputs.SHA_SHORT }}`
            - **功能详情 / Features Detail:** [README.md](https://github.com/AstideLabs/android_kernel_xiaomi_sm8250/blob/android16-aptusitu-new/README.md)
            - **包含设备 / Devices:** `psyche, thyme, umi, munch, lmi, cmi, cas, apollo, alioth, elish, enuma, dagu, pipa`
            
            ### 更新内容 / What's Changed

            - ***待补完 / Wait for writing***

            ---
            **分类指南 / Instruction:**
            - **MIUI**: 适用于小米官方或基于小米官方修改的 ROM。
            - **AOSP**: 适用于类原生 ROM。
            - **ReSukiSU-SuSFS**: 已集成 ReSukiSU 和 SuSFS。
          files: all_kernels/*.zip
